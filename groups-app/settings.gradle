pluginManagement {
    repositories {
        google()
        // Maven Central through Google's copy of it first (Maven Central itself refuses busy downloaders).
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = 'groups-app'
include ':app'
