plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tg.comments'
    compileSdk 35

    defaultConfig {
        applicationId 'app.tg.comments'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            def keystore = System.getenv('COMMENTS_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('COMMENTS_KEYSTORE_PASSWORD')
                keyAlias 'comments'
                keyPassword System.getenv('COMMENTS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('COMMENTS_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
