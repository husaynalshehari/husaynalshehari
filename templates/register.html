{% extends "base.html" %}
{% block title %}التسجيل برمز الدعوة — {{ app_name }}{% endblock %}
{% block main_class %}page page-narrow{% endblock %}
{% block content %}
<section class="card">
  <h1>التسجيل برمز الدعوة</h1>
  <p class="muted">اكتب الرمز اللي وصلك من المدير، واختر كلمة مرور لحسابك.</p>

  <form method="post" action="{{ url_for('register') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">
      <span>رمز الدعوة</span>
      <input name="code" value="{{ code or '' }}" class="code-input" dir="ltr"
             placeholder="XXXX-XXXX-XXXX" autocomplete="one-time-code"
             autocapitalize="characters" spellcheck="false" required {% if not code %}autofocus{% endif %}>
    </label>
    <label class="field">
      <span>كلمة المرور</span>
      <input type="password" name="password" autocomplete="new-password" minlength="8" required
             {% if code %}autofocus{% endif %}>
      <small class="muted">8 أحرف على الأقل</small>
    </label>
    <label class="field">
      <span>تأكيد كلمة المرور</span>
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">تسجيل</button>
  </form>

  <p class="card-foot">
    عندك حساب؟ <a href="{{ url_for('login') }}">ادخل من هنا</a>
  </p>
</section>
{% endblock %}
