{% extends "base.html" %}
{% block title %}تسجيل الدخول — {{ app_name }}{% endblock %}
{% block main_class %}page page-narrow{% endblock %}
{% block content %}
<section class="card">
  <h1>تسجيل الدخول</h1>
  <p class="muted">هذا التطبيق خاص. الدخول لأصحاب الحسابات فقط.</p>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">
      <span>اسم المستخدم</span>
      <input name="username" value="{{ username or '' }}" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label class="field">
      <span>كلمة المرور</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">دخول</button>
  </form>

  <p class="card-foot">
    وصلك رمز دعوة؟ <a href="{{ url_for('register') }}">سجّل حسابك من هنا</a>
  </p>
</section>
{% endblock %}
