name: Build GoldExtractor APK

on:
  push:
    branches: [gold-extractor]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish APK and project as public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GoldExtractor.apk
          git archive --format=zip --prefix=GoldExtractor/ -o GoldExtractor-project.zip HEAD
          TAG="gold-extractor-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" GoldExtractor.apk GoldExtractor-project.zip \
            --target "$GITHUB_SHA" \
            --title "GoldExtractor v${GITHUB_RUN_NUMBER}" \
            --notes "Android APK built automatically from the gold-extractor branch." \
            --latest
